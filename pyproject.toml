[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "prompt-rubric-drift"
version = "0.1.7"
description = "LLM evaluation prompt and rubric drift review: detect deterministic drift and produce pull request review reports."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [{ name = "AuraOne", email = "opensource@auraone.ai" }]
keywords = ["prompt-engineering", "rubric", "drift-detection", "llm-evaluation", "evals", "github-action"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Software Development :: Quality Assurance",
  "Topic :: Software Development :: Version Control",
]

[project.urls]
Homepage = "https://auraone.ai/open/rubric-studio-open"
Source = "https://github.com/auraoneai/prompt-rubric-drift"
Documentation = "https://github.com/auraoneai/prompt-rubric-drift#readme"
Repository = "https://github.com/auraoneai/prompt-rubric-drift.git"
Issues = "https://github.com/auraoneai/prompt-rubric-drift/issues"
Changelog = "https://github.com/auraoneai/prompt-rubric-drift/blob/main/CHANGELOG.md"

[project.scripts]
prompt-rubric-drift = "prompt_rubric_drift.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
